[package]
name = "pi-durable"
version = "0.1.0"
edition = "2024"
description = "Durable conversations, tasks and documents over a transactional store, with a synchronous agent harness and pi-ai style providers. A Rust reproduction of Pi's pi-durable."
license = "MIT"
readme = "README.md"
keywords = ["llm", "agent", "durable", "sqlite", "anthropic"]
categories = ["database", "api-bindings"]
exclude = ["/flake.nix", "/flake.lock", "/result*"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
unicode-normalization = "0.1"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
ring = { version = "0.17", optional = true }

[features]
default = []
http = ["dep:rustls", "dep:webpki-roots", "dep:ring"]
anthropic = ["http"]
openai = ["http"]
vercel-gateway = ["anthropic"]
providers = ["anthropic", "openai", "vercel-gateway"]

[[example]]
name = "agent"
required-features = ["providers"]

[[example]]
name = "provider_e2e"
required-features = ["anthropic"]

[[example]]
name = "openai_responses_e2e"
required-features = ["openai"]

[[example]]
name = "oauth_flow"
required-features = ["anthropic"]

[[example]]
name = "openai_completions_e2e"
required-features = ["openai"]
